<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{{PAGE_TITLE}}</title>
    <link rel="icon" type="image/png" href="/shared/favicon.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background-color: #030806;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% -5%, rgba(18, 60, 32, 0.5) 0%, transparent 55%),
                radial-gradient(ellipse 50% 30% at 50% 105%, rgba(12, 45, 22, 0.3) 0%, transparent 55%);
            color: #e8f0ea;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            display: flex; align-items: center; justify-content: center;
            padding: 28px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .header img { height: 48px; width: auto; display: block; }

        .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

        .hero { text-align: center; padding: 64px 8px 40px; }
        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(42, 120, 70, 0.18); border: 1px solid rgba(60, 160, 90, 0.3);
            border-radius: 100px; padding: 6px 18px; font-size: 12px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase; color: #5dd98a; margin-bottom: 28px;
        }
        .hero h1 {
            font-size: clamp(30px, 5.5vw, 48px); font-weight: 800; line-height: 1.13;
            letter-spacing: -0.025em; color: #fff; margin-bottom: 20px;
        }
        .hero p { font-size: clamp(16px, 2.2vw, 19px); line-height: 1.65; color: rgba(220, 240, 228, 0.65); }
        .hero-thumb {
            margin: 36px auto 0; max-width: 560px; border-radius: 16px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }
        .hero-thumb img { display: block; width: 100%; height: auto; }
        .jump {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 28px;
            color: #4cd97b; font-size: 14px; font-weight: 600; text-decoration: none;
            border: 1px solid rgba(76, 217, 123, 0.35); border-radius: 100px; padding: 9px 18px;
        }
        .jump:hover { background: rgba(76, 217, 123, 0.1); }

        .card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 36px 32px; margin-bottom: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .card h2 { font-size: clamp(22px, 3.4vw, 28px); font-weight: 800; color: #fff; letter-spacing: -0.015em; line-height: 1.25; margin-bottom: 18px; }
        .card h3 { font-size: 18px; font-weight: 700; color: #fff; margin: 24px 0 10px; }
        .card p, .card li { font-size: 16.5px; line-height: 1.7; color: rgba(225, 240, 230, 0.82); }
        .card p + p, .card p + ul, .card p + ol, .card ul + p, .card ol + p, .card table + p, .card p + table { margin-top: 14px; }
        .card ul, .card ol { padding-left: 22px; }
        .card li + li { margin-top: 8px; }
        .card li::marker { color: #4cd97b; }
        .card strong { color: #fff; font-weight: 700; }
        .card em { color: #c9f0d6; }
        .table-wrap { overflow-x: auto; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); vertical-align: top; line-height: 1.5; color: rgba(225, 240, 230, 0.82); }
        th { color: #4cd97b; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
        td:first-child { color: #fff; font-weight: 600; }

        .card.transcript { background: rgba(255, 255, 255, 0.02); }
        .card.transcript p { font-size: 15.5px; color: rgba(225, 240, 230, 0.72); }
        .card.transcript p:first-of-type { color: rgba(225, 240, 230, 0.5); font-style: italic; }

        .more {
            text-align: center; padding: 40px 24px; margin: 12px 0 20px;
            border: 1px solid rgba(76, 217, 123, 0.25); border-radius: 20px;
            background: rgba(42, 120, 70, 0.1);
        }
        .more h2 { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .more p { color: rgba(220, 240, 228, 0.65); line-height: 1.6; margin-bottom: 22px; }
        .more a {
            display: inline-flex; align-items: center; gap: 8px; background: #4cd97b; color: #04130a;
            font-weight: 700; text-decoration: none; padding: 13px 24px; border-radius: 12px;
        }
        .more a svg { width: 18px; height: 18px; }

        .footer { padding: 40px 24px 56px; text-align: center; }
        .footer img { height: 28px; opacity: 0.5; }

        @media (max-width: 560px) {
            .hero { padding: 44px 0 28px; }
            .card { padding: 26px 20px; border-radius: 16px; }
            th, td { padding: 10px 8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="/shared/Lincko-logo.png" alt="Lincko">
    </header>

    <main class="wrap">
        <section class="hero">
            <div class="badge">Free resource from Dan James</div>
            <h1>{{TITLE}}</h1>
            {{INTRO_HTML}}
            {{THUMB_HTML}}
            {{JUMP_HTML}}
        </section>

{{SECTIONS_HTML}}

        <section class="more">
            <h2>Want more like this?</h2>
            <p>Every resource from my YouTube videos, in one place.</p>
            <a href="/resources">See every resource <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
        </section>
    </main>

    <footer class="footer">
        <img src="/shared/Lincko-logo.png" alt="Lincko">
    </footer>
</body>
</html>
